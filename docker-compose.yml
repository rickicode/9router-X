services:
  9router-x:
    build:
      context: .
      dockerfile: Dockerfile
    image: 9router-x:latest
    container_name: 9router-x
    restart: always
    ports:
      - "20127:20128"
    volumes:
      - 9router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://host.docker.internal:8787
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  9router-data:
    name: 9router-data
    external: true
