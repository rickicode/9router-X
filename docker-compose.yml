services:
  9router-x:
    build:
      context: .
      dockerfile: Dockerfile
    image: 9router-x:latest
    container_name: 9router-x
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: always
    ports:
      - "10128:10128"
    volumes:
      - 9router-data:/app/data
      - 9router-tailscale:/var/lib/tailscale
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "10128"
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Jakarta
      NODE_ENV: production
      DATABASE_URL: postgres://9router:${POSTGRES_PASSWORD:-password123}@postgres:5432/9router
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      HEADROOM_URL: http://headroom:8787
      TAILSCALE_AUTHKEY: ${TAILSCALE_AUTHKEY:-${TS_AUTHKEY:-}}
      TAILSCALE_HOSTNAME: ${TAILSCALE_HOSTNAME:-9router-x}
      TAILSCALE_SERVE: ${TAILSCALE_SERVE:-true}
      # Opt-in: return unredacted request-details payloads (default redacted).
      # Only enable while dashboard login is enforced (requireLogin !== false).
      REQUEST_DETAILS_SHOW_RAW: ${REQUEST_DETAILS_SHOW_RAW:-false}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      headroom:
        condition: service_started
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: 9router-postgres
    restart: always
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=1024MB"
      - "-c"
      - "effective_cache_size=3072MB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=32MB"
    environment:
      POSTGRES_USER: 9router
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: 9router
      TZ: Asia/Jakarta
    volumes:
      - 9router-pgdata:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 9router -d 9router"]
      interval: 5s
      timeout: 5s
      retries: 5

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  9router-data:
    name: 9router-data
    external: true
  9router-tailscale:
    name: 9router-tailscale
  9router-pgdata:
    name: 9router-pgdata
