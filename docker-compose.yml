services:
  9router-x:
    build:
      context: .
      dockerfile: Dockerfile
    image: 9router-x:latest
    container_name: 9router-x
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: always
    ports:
      - "10128:10128"
    volumes:
      - 9router-data:/app/data
      - 9router-tailscale:/var/lib/tailscale
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "10128"
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Jakarta
      NODE_ENV: production
      DATABASE_URL: postgres://9router:${POSTGRES_PASSWORD:-password123}@postgres:5432/9router
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword123}@redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      HEADROOM_URL: http://headroom:8787
      TAILSCALE_AUTHKEY: ${TAILSCALE_AUTHKEY:-${TS_AUTHKEY:-}}
      TAILSCALE_HOSTNAME: ${TAILSCALE_HOSTNAME:-9router-x}
      TAILSCALE_SERVE: ${TAILSCALE_SERVE:-true}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      headroom:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: 9router-postgres
    restart: always
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
    environment:
      POSTGRES_USER: 9router
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: 9router
      TZ: Asia/Jakarta
    volumes:
      - 9router-pgdata:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 9router -d 9router"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    container_name: 9router-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6381}:6379"
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory", "768mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD:-redispassword123}", "--tcp-backlog", "511"]
    volumes:
      - 9router-redisdata:/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD:-redispassword123}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  9router-data:
    name: 9router-data
    external: true
  9router-tailscale:
    name: 9router-tailscale
  9router-pgdata:
    name: 9router-pgdata
  9router-redisdata:
    name: 9router-redisdata
