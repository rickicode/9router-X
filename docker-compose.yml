services:
  # API gateway — Hono + node:cluster. Serves /v1/*, /v1beta/*, /codex,
  # /responses. Runs SEPARATELY from the dashboard so gateway traffic never
  # contends with the dashboard's event loop. Auto-restart via restart:always
  # + Docker HEALTHCHECK.
  9router-api:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: 9router-api:latest
    container_name: 9router-api
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    mem_limit: 2g
    memswap_limit: 2g
    ports:
      - "3778:3778"
    volumes:
      - 9router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      GATEWAY_PORT: "3778"
      GATEWAY_WORKERS: "4"
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Jakarta
      NODE_ENV: production
      MALLOC_ARENA_MAX: "2"
      DATABASE_URL: postgres://9router:${POSTGRES_PASSWORD:-password123}@postgres:5432/9router
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3778/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
  9router-x:
    build:
      context: .
      dockerfile: Dockerfile
    image: 9router-x:latest
    container_name: 9router-x
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: always
    # Box max is 4GB total: app 2.5g + postgres 1g leaves ~0.5g for the
    # host/docker. OOM kills recycle just this container (restart: always).
    mem_limit: 2500m
    memswap_limit: 2500m
    ports:
      - "3777:3777"
    volumes:
      - 9router-data:/app/data
      - /opt/9router-x/logs:/app/data/logs
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "3777"
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Jakarta
      NODE_ENV: production
      # RAM hygiene (4GB box, native-heavy SSE workload):
      # - glibc arena cap + eager trim: RSS would otherwise pin freed chunks.
      # - dispatcher cache 128 (from 512 default): fewer idle SOCKS/TLS tunnels held.
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
      PROXY_DISPATCHERS_MAX_SIZE: "128"
      DATABASE_URL: postgres://9router:${POSTGRES_PASSWORD:-password123}@postgres:5432/9router
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Opt-in: return unredacted request-details payloads (default redacted).
      # Only enable while dashboard login is enforced (requireLogin !== false).
      REQUEST_DETAILS_SHOW_RAW: ${REQUEST_DETAILS_SHOW_RAW:-false}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: 9router-postgres
    restart: always
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      # Memory must fit inside the 1g mem_limit above. The previous values
      # (shared_buffers=1024MB + work_mem=32MB x 300 conns +
      # effective_cache_size=3072MB) exceeded the container ceiling ->
      # OOMKilled -> WAL crash recovery -> every client pool goes stale until
      # a manual restart. Resized for 1g: shared + per-conn memory stays
      # bounded even at max_connections.
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "restart_after_crash=on"
    environment:
      POSTGRES_USER: 9router
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: 9router
      TZ: Asia/Jakarta
    volumes:
      - 9router-pgdata:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 9router -d 9router"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  9router-data:
    name: 9router-data
    external: true
  9router-pgdata:
    name: 9router-pgdata
