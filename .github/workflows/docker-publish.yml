name: Build and Push Docker Image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Registry refs MUST be lowercase. The repo slug `rickicode/axonrouter-X`
      # carries an uppercase X, and buildx rejects it outright:
      #   invalid reference format: repository name (rickicode/axonrouter-X)
      #   must be lowercase
      # Fail fast here (before buildx) instead of 27s into a docker build.
      - name: Resolve lowercase GHCR image ref
        id: image
        run: |
          ref="ghcr.io/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          case "${ref}" in
            *[!a-z0-9/._-]*|*' '*)
              echo "::error::image ref still contains invalid characters: ${ref}"
              exit 1 ;;
          esac
          echo "image ref: ${ref}"

      # Guard: the committed package-lock.json must be npm-10-compatible (the
      # Docker image ships npm 10.9.8). Fails fast with a fix hint instead of a
      # cryptic `npm ci` EUSAGE error. See AGENTS.md §1.
      - name: Verify lockfile is npm-10-compatible
        run: node scripts/verify-lockfile-npm10.mjs

      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          images: |
            ${{ steps.image.outputs.ref }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.image.outputs.ref }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.ref }}:buildcache,mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false
